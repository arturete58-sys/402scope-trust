[package]
name = "scope-agent-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
scope-attestations = { path = "../attestations" }
scope-trust-policy = { path = "../trust-policy" }
scope-spending-limit = { path = "../spending-limit" }
scope-ed25519-verifier = { path = "../ed25519-verifier" }
ed25519-dalek = "2.1.1"
scope-webauthn-verifier = { path = "../webauthn-verifier" }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
