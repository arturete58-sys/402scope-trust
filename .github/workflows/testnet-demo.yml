name: Testnet demo

# Runs the full flow on Stellar testnet: deploy the contract, run a seller and
# a facilitator, measure with real paid calls, write attestations onchain and
# read them back. Results (contract ID and transaction links) are attached to
# the run as demo-result.json and printed in the job summary.

on:
  workflow_dispatch:
    inputs:
      calls:
        description: Paid calls per endpoint
        default: '5'
  push:
    branches: [main]
    paths: ['src/**', 'contracts/*/src/**', 'contracts/Cargo.toml', '.github/workflows/testnet-demo.yml']

concurrency:
  group: testnet-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # SEP-55: attest the exact wasm files this run deploys, so explorers can link them to this repository.
      id-token: write
      attestations: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Install the Stellar CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Build contract
        working-directory: contracts
        # SEP-55 build info: source repository and home domain go into the contract meta.
        run: bash ../scripts/run-and-annotate.sh "contract build" stellar contract build --meta source_repo=github:${{ github.repository }} --meta home_domain=402scope.org
      - name: Attest the contract builds (SEP-55)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: contracts/target/wasm32v1-none/release/*.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run the testnet demo
        run: bash scripts/run-and-annotate.sh "testnet demo" node dist/demo/testnet.js --wasm-dir contracts/target/wasm32v1-none/release --calls "${{ github.event.inputs.calls || '5' }}" --out demo-result.json
      - name: Summary
        if: always()
        run: |
          if [ -f demo-result.json ]; then
            node scripts/demo-report.mjs demo-result.json | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=testnet demo::$(node -e 'const r=require("./demo-result.json");console.log(JSON.stringify({wallet:r.walletPayments,sellers:(r.sellers||[]).map(s=>[s.label,s.trustedBy2of2,s.attestations.map(a=>a.score)]),evidence:r.evidence}))')"
          fi
      - name: Publish results in the repository
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/testnet
          cp demo-result.json docs/testnet/latest.json
          node scripts/demo-report.mjs demo-result.json > docs/testnet/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testnet
          git commit -q -m "Testnet demo results" || exit 0
          # Logs are not readable from outside; failures are reported as annotations.
          out=$( { git pull --rebase origin main && git push origin HEAD:main; } 2>&1 ) || { echo "::error title=publish::$(echo "$out" | tr '\n' ' ' | cut -c1-900)"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-result
          path: demo-result.json
          if-no-files-found: ignore
